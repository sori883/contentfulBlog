name: Resolve dependency updates
on:
  push:
    branches: [codex/resolve-renovate-lock]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
      - name: Apply the dependency versions for this update
        run: |
          npm pkg set 'engines.node=>=24.22.3' 'packageManager=pnpm@12.21.0' 'dependencies.hono=^4.13.16' 'devDependencies.@cloudflare/workers-types=^5.20261123.1' 'devDependencies.@eslint/js=^10.0.1' 'devDependencies.@types/node=^24.19.2' 'devDependencies.eslint=^10.15.0' 'devDependencies.playwright=^1.65.1' 'devDependencies.typescript=~5.9.3' 'devDependencies.typescript-eslint=^8.73.0' 'devDependencies.vite=^8.3.8' 'devDependencies.wrangler=^4.166.0'
          cat > pnpm-workspace.yaml <<'YAML'
          allowBuilds:
            esbuild: false
            unrs-resolver: false
            workerd: false
          overrides:
            "brace-expansion@>=5.0.0 <5.0.13": "^5.0.13"
            "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
            "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
            "undici@>=7.0.0 <7.30.1": "^7.30.1"
            "@hono/node-server@>=1.19.10 <2.1.3": "^2.1.3"
            "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
          YAML
      - uses: pnpm/action-setup@v6
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Export the lockfile change
        run: |
          git diff -- pnpm-lock.yaml | gzip -c | base64 -w 92 | sed 's/^/LOCK_DIFF /'
      - run: pnpm audit --prod
